dag_type: plain_text
description: Build a piece of software to extract the latest seed round raises per
  day, categorize them by industry, and present a singular report in the morning.
name: extractlatestseedroundraises
nodes:
  analyzedataforindustry:
    agent: false
    description: Identify meaningful patterns and trends in the data.
    name: analyzedataforindustry
    nodes_depended_on:
    - initialdatacleaning
    nodes_dependent_on:
    - industryclassification
    prompt: Analyze the preprocessed data to determine patterns, trends, or insights
      related to the seed round raises by industry. Consider factors such as average
      raise sizes, frequency of raises, or changes over time.
  datacollection:
    agent: false
    description: Collect and preprocess the data for analysis.
    name: datacollection
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Extract the latest seed round raises data from sources such as Crunchbase,
      VentureData, or private databases. Ensure the data is complete, accurate, and
      up-to-date.
  generatereport:
    agent: false
    description: Compose a comprehensive and clear report for stakeholders.
    name: generatereport
    nodes_depended_on:
    - industryclassification
    - analyzedataforindustry
    nodes_dependent_on: []
    prompt: Create a singular report showcasing the latest seed round raises per day,
      categorized by industry, with insights, patterns, or trends as found in the
      analysis. Focus on the story, and present the data in an understandable and
      visually appealing way.
  identifymissingdata:
    agent: false
    description: Determine the necessary actions to rectify data inconsistencies.
    name: identifymissingdata
    nodes_depended_on:
    - datacollection
    nodes_dependent_on:
    - initialdatacleaning
    prompt: Identify which data points are missing, incomplete, or have any issues.
      Suggest potential sources or solutions for addressing these gaps.
  industryclassification:
    agent: false
    description: Categorize the companies by industry for comparative analysis.
    name: industryclassification
    nodes_depended_on:
    - initialdatacleaning
    nodes_dependent_on:
    - analyzedataforindustry
    prompt: Classify the extracted data into relevant industries based on predefined
      categories or classification systems. Consider data attributes and characteristics
      that indicate industry affiliation.
  initialdatacleaning:
    agent: false
    description: Clean and process the raw data for analysis.
    name: initialdatacleaning
    nodes_depended_on:
    - datacollection
    nodes_dependent_on:
    - identifymissingdata
    prompt: Perform an initial data cleaning process to remove duplicates, null values,
      and incorrect format. Handle any edge cases and data inconsistencies.
