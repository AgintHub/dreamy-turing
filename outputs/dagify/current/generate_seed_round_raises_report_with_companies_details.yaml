dag_type: plain_text
description: Create a report showcasing the latest seed round raises per day, categorized
  by industry, with a list of companies that raised within each industry.
name: generate_seed_round_raises_report_with_companies
nodes:
  analyze_data_for_industry_insights:
    agent: false
    description: Identify meaningful patterns and trends in the data.
    name: analyze_data_for_industry_insights
    nodes_depended_on:
    - classify_companies_by_industry
    - identify_missing_data
    nodes_dependent_on: []
    prompt: Analyze the preprocessed data to determine patterns, trends, or insights
      related to the seed round raises by industry. Consider factors such as average
      raise sizes, frequency of raises, or changes over time.
  classify_companies_by_industry:
    agent: false
    description: Categorize the companies by industry for comparative analysis.
    name: classify_companies_by_industry
    nodes_depended_on:
    - perform_initial_data_cleaning
    nodes_dependent_on: []
    prompt: Classify the extracted data into relevant industries based on predefined
      categories or classification systems. Consider data attributes and characteristics
      that indicate industry affiliation.
  create_report_with_industry_insights_and_company_lists:
    agent: false
    description: Compose a report that includes industry insights and company lists.
    name: create_report_with_industry_insights_and_company_lists
    nodes_depended_on:
    - analyze_data_for_industry_insights
    - generate_list_of_companies_that_raised_within_each_industry
    nodes_dependent_on: []
    prompt: Create a comprehensive and clear report showcasing the latest seed round
      raises per day, categorized by industry, with insights, patterns, or trends
      as found in the analysis, and including the list of companies that raised within
      each industry.
  extract_seed_round_raises_data:
    agent: false
    description: Collect and preprocess the seed round raises data for analysis.
    name: extract_seed_round_raises_data
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Extract the latest seed round raises data from sources such as Crunchbase,
      VentureData, or private databases. Ensure the data is complete, accurate, and
      up-to-date.
  generate_list_of_companies_that_raised_within_each_industry:
    agent: false
    description: Produce a list of companies that raised within each industry.
    name: generate_list_of_companies_that_raised_within_each_industry
    nodes_depended_on:
    - analyze_data_for_industry_insights
    nodes_dependent_on: []
    prompt: Create a list of companies that raised within each industry, based on
      the analyzed data.
  identify_missing_data:
    agent: false
    description: Determine the necessary actions to rectify data inconsistencies.
    name: identify_missing_data
    nodes_depended_on:
    - perform_initial_data_cleaning
    nodes_dependent_on: []
    prompt: Identify which data points are missing, incomplete, or have any issues.
      Suggest potential sources or solutions for addressing these gaps.
  perform_initial_data_cleaning:
    agent: false
    description: Clean and process the raw data for analysis.
    name: perform_initial_data_cleaning
    nodes_depended_on:
    - extract_seed_round_raises_data
    nodes_dependent_on: []
    prompt: Clean the raw seed round raises data by removing duplicates, null values,
      and incorrect formats. Handle any edge cases and data inconsistencies.
